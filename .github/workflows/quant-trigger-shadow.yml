name: Quant Trigger Event Bridge

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      retry_openai:
        description: "Retry after adding OpenAI API credits (fresh trigger evidence still required)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "quant/decision-consumer.js"
      - "quant/agent-team.js"
      - "quant/budget-team.js"
      - "quant/api-budget.js"
      - "quant/model-client.js"
      - "quant/decision-policy.js"
      - "quant/trigger-engine.js"
      - "quant/tests/**"
      - ".github/workflows/quant-trigger-shadow.yml"

permissions:
  contents: write

concurrency:
  group: quant-trigger-event-bridge
  cancel-in-progress: false

env:
  TRIGGER_COOLDOWN_MINUTES: "60"

jobs:
  trigger-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate universe selector and matrix contract
        run: |
          node --check quant/daily-universe-selector.js
          node --check universe-matrix.js
          node --test quant/tests/*.test.js
          node --check quant/decision-consumer.js
          node --check quant/agent-team.js
          node --check quant/api-budget.js
          node --check quant/model-client.js
          node --check quant/budget-team.js
          node --check quant/decision-policy.js
          node --check quant/trigger-engine.js

      - name: Check daily universe refresh
        id: universe
        shell: bash
        run: |
          TODAY=$(date -u +%F)
          LAST=$(node -e "const fs=require('fs'),vm=require('vm');const s={window:{}};vm.createContext(s);vm.runInContext(fs.readFileSync('data.js','utf8'),s);process.stdout.write((s.window.PORTFOLIO_DATA.strategyState?.dailyUniverseSelection?.selectedAt||'').slice(0,10))")
          HOUR=$(date -u +%H)
          if [ "$LAST" != "$TODAY" ] && [ "$HOUR" -ge 12 ]; then echo "refresh=true" >> "$GITHUB_OUTPUT"; else echo "refresh=false" >> "$GITHUB_OUTPUT"; fi

      - name: Run daily universe selector
        if: steps.universe.outputs.refresh == 'true'
        run: node quant/daily-universe-selector.js

      - name: Commit daily universe selection
        if: steps.universe.outputs.refresh == 'true'
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "main changed; fail closed"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js quant/daily-universe.json
          git commit -m "Daily Quant universe selection $(date -u +%F)"
          git push origin HEAD:main
          git fetch origin main
          test "$(cat data.js)" = "$(git show origin/main:data.js)"
          test "$(cat quant/daily-universe.json)" = "$(git show origin/main:quant/daily-universe.json)"

      - name: Refresh checkout after universe commit
        if: steps.universe.outputs.refresh == 'true'
        run: git reset --hard origin/main

      - name: Update strategy feedback
        run: node quant/strategy-feedback.js

      - name: Commit strategy feedback
        shell: bash
        run: |
          if ! git diff --quiet -- data.js quant/strategy-feedback.json; then
            git fetch origin main
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "main changed; fail closed"; exit 1; }
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.js quant/strategy-feedback.json
            git commit -m "Update Quant strategy feedback"
            git push origin HEAD:main
            git fetch origin main
            test "$(cat data.js)" = "$(git show origin/main:data.js)"
            test "$(cat quant/strategy-feedback.json)" = "$(git show origin/main:quant/strategy-feedback.json)"
            git reset --hard origin/main
          fi

      - name: Run trigger engine
        run: node quant/trigger-engine.js

      - name: Show trigger result
        run: cat quant/trigger.json

      - name: Check whether decision is required
        id: trigger
        shell: bash
        run: |
          NEEDS=$(node -e "const x=require('./quant/trigger.json'); process.stdout.write(String(x.needsDecision))")
          echo "needs=$NEEDS" >> "$GITHUB_OUTPUT"

      - name: Run Quant Trader decision consumer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QUANT_RETRY_OPENAI: ${{ inputs.retry_openai }}
        shell: bash
        run: |
          node quant/decision-consumer.js

      - name: Commit monitoring, budget and verified decision artifacts
        if: always()
        shell: bash
        run: |
          node -e "const fs=require('fs'),vm=require('vm'),s={window:{}};vm.runInNewContext(fs.readFileSync('data.js','utf8'),s,{timeout:1000});require('./quant/agent-team').validateLedger(s.window.PORTFOLIO_DATA)"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "main changed; fail closed"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js quant/decision-event.json quant/decision-result.json quant/agent-reviews
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Quant monitoring, API budget and decision state"
          git push origin HEAD:main
          git fetch origin main
          for f in $(git diff-tree --no-commit-id --name-only -r HEAD); do
            test "$(cat "$f")" = "$(git show "origin/main:$f")"
          done
          echo "Authoritative state committed and exact read-back verified."
