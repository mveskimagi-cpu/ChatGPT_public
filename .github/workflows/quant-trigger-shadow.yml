name: Quant Trigger PR Bridge

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: quant-trigger-pr-bridge
  cancel-in-progress: true

env:
  TRIGGER_BRANCH: quant-trigger-event
  TRIGGER_COOLDOWN_MINUTES: "60"

jobs:
  trigger-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run trigger engine
        run: node quant/trigger-engine.js

      - name: Show trigger result
        run: cat quant/trigger.json

      - name: Stop when there is no trigger
        id: gate
        shell: bash
        run: |
          NEEDS=$(node -e "const x=require('./quant/trigger.json'); process.stdout.write(String(x.needsDecision))")
          if [ "$NEEDS" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No trigger. No branch/PR activity."
            exit 0
          fi

          cp quant/trigger.json /tmp/trigger.json
          NEW_KEY=$(node -e "const x=require('/tmp/trigger.json'); process.stdout.write(x.triggerKey||'')")
          NOW_MS=$(node -e "process.stdout.write(String(Date.now()))")

          git fetch origin "$TRIGGER_BRANCH" 2>/dev/null || true

          if git show-ref --verify --quiet "refs/remotes/origin/$TRIGGER_BRANCH"; then
            git show "origin/$TRIGGER_BRANCH:quant/trigger.json" > /tmp/previous-trigger.json 2>/dev/null || true
          fi

          if [ -s /tmp/previous-trigger.json ]; then
            OLD_KEY=$(node -e "const x=require('/tmp/previous-trigger.json'); process.stdout.write(x.triggerKey||'')")
            OLD_TS=$(node -e "const x=require('/tmp/previous-trigger.json'); process.stdout.write(x.triggeredAt||'')")
            OLD_MS=$(node -e "const d=Date.parse(process.argv[1]); process.stdout.write(String(Number.isFinite(d)?d:0))" "$OLD_TS")
            AGE_MIN=$(( (NOW_MS - OLD_MS) / 60000 ))

            if [ "$NEW_KEY" = "$OLD_KEY" ] && [ "$AGE_MIN" -lt "$TRIGGER_COOLDOWN_MINUTES" ]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "Same trigger key within cooldown (${AGE_MIN}m). No PR update."
              exit 0
            fi
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish trigger to dedicated branch
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$TRIGGER_BRANCH" origin/main
          mkdir -p quant
          cp /tmp/trigger.json quant/trigger.json

          git add quant/trigger.json
          git commit -m "Quant trigger event $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force-with-lease origin "$TRIGGER_BRANCH"

      - name: Create or reuse trigger PR
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PR=$(gh pr list --head "$TRIGGER_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            gh pr create               --base main               --head "$TRIGGER_BRANCH"               --title "Quant trigger event — decision required"               --body "Automated shadow sensor detected a market condition that requires Quant Trader review. The authoritative event payload is in `quant/trigger.json` on this PR branch. This PR MUST NOT be merged as a trade. A decision workflow should re-read current `main/data.js`, re-fetch fresh market data, and only then decide HOLD/BUY/SELL/REDUCE."
          else
            gh pr comment "$PR" --body "Trigger bridge updated at $(date -u +%Y-%m-%dT%H:%M:%SZ). Re-read `quant/trigger.json` from the PR head and current `main/data.js` before any decision."
          fi
