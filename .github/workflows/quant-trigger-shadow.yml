name: Quant Trigger Event Bridge

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quant-trigger-event-bridge
  cancel-in-progress: true

env:
  TRIGGER_COOLDOWN_MINUTES: "60"

jobs:
  trigger-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate universe selector and matrix contract
        run: |
          node --check quant/daily-universe-selector.js
          node --check universe-matrix.js
          node --test quant/tests/universe-matrix.test.js

      - name: Check daily universe refresh
        id: universe
        shell: bash
        run: |
          TODAY=$(date -u +%F)
          LAST=$(node -e "const fs=require('fs'),vm=require('vm');const s={window:{}};vm.createContext(s);vm.runInContext(fs.readFileSync('data.js','utf8'),s);process.stdout.write((s.window.PORTFOLIO_DATA.strategyState?.dailyUniverseSelection?.selectedAt||'').slice(0,10))")
          HOUR=$(date -u +%H)
          if [ "$LAST" != "$TODAY" ] && [ "$HOUR" -ge 12 ]; then echo "refresh=true" >> "$GITHUB_OUTPUT"; else echo "refresh=false" >> "$GITHUB_OUTPUT"; fi

      - name: Run daily universe selector
        if: steps.universe.outputs.refresh == 'true'
        run: node quant/daily-universe-selector.js

      - name: Commit daily universe selection
        if: steps.universe.outputs.refresh == 'true'
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "main changed; fail closed"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js quant/daily-universe.json
          git commit -m "Daily Quant universe selection $(date -u +%F)"
          git push origin HEAD:main
          git fetch origin main
          test "$(cat data.js)" = "$(git show origin/main:data.js)"
          test "$(cat quant/daily-universe.json)" = "$(git show origin/main:quant/daily-universe.json)"

      - name: Refresh checkout after universe commit
        if: steps.universe.outputs.refresh == 'true'
        run: git reset --hard origin/main

      - name: Update strategy feedback
        run: node quant/strategy-feedback.js

      - name: Commit strategy feedback
        shell: bash
        run: |
          if ! git diff --quiet -- data.js quant/strategy-feedback.json; then
            git fetch origin main
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "main changed; fail closed"; exit 1; }
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.js quant/strategy-feedback.json
            git commit -m "Update Quant strategy feedback"
            git push origin HEAD:main
            git fetch origin main
            test "$(cat data.js)" = "$(git show origin/main:data.js)"
            test "$(cat quant/strategy-feedback.json)" = "$(git show origin/main:quant/strategy-feedback.json)"
            git reset --hard origin/main
          fi

      - name: Run trigger engine
        run: node quant/trigger-engine.js

      - name: Show trigger result
        run: cat quant/trigger.json

      - name: Check whether decision is required
        id: trigger
        shell: bash
        run: |
          NEEDS=$(node -e "const x=require('./quant/trigger.json'); process.stdout.write(String(x.needsDecision))")
          echo "needs=$NEEDS" >> "$GITHUB_OUTPUT"

      - name: Run Quant Trader decision consumer
        if: steps.trigger.outputs.needs == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY"
          node quant/decision-consumer.js

      - name: Check whether consumer produced a decision
        id: consumer
        if: steps.trigger.outputs.needs == 'true'
        shell: bash
        run: |
          if git diff --quiet -- quant/decision-event.json quant/decision-result.json data.js; then
            echo "produced=false" >> "$GITHUB_OUTPUT"
            echo "Duplicate/immaterial trigger suppressed; no model decision artifact to commit."
          else
            echo "produced=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit suppressed-run mark-to-market
        if: steps.trigger.outputs.needs == 'true' && steps.consumer.outputs.produced == 'true'
        shell: bash
        run: |
          if git diff --quiet -- quant/decision-event.json quant/decision-result.json && ! git diff --quiet -- data.js; then
            git fetch origin main
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "main changed; fail closed"; exit 1; }
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.js
            git commit -m "Mark Quant positions to market"
            git push origin HEAD:main
            git fetch origin main
            test "$(cat data.js)" = "$(git show origin/main:data.js)"
            echo "Mark-to-market commit and exact read-back verified."
            echo "mtm_only=true" >> "$GITHUB_ENV"
          fi

      - name: Commit verified decision artifacts
        if: steps.trigger.outputs.needs == 'true' && steps.consumer.outputs.produced == 'true' && env.mtm_only != 'true'
        shell: bash
        run: |
          git fetch origin main
          BASE_SHA=$(node -e "const x=require('./quant/decision-result.json'); process.stdout.write(x.baseCommitSha)")
          REMOTE_SHA=$(git rev-parse origin/main)
          if [ "$BASE_SHA" != "$REMOTE_SHA" ]; then
            echo "Authoritative main changed during decision; fail closed."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add quant/decision-event.json quant/decision-result.json
          if ! git diff --quiet -- data.js; then
            git add data.js
          fi

          git commit -m "Quant decision $(node -e "const x=require('./quant/decision-result.json'); process.stdout.write(x.decision)") $(node -e "const x=require('./quant/decision-result.json'); process.stdout.write(x.triggerKey)")"
          git push origin HEAD:main

          git fetch origin main
          for f in quant/decision-event.json quant/decision-result.json; do
            EXPECTED=$(cat "$f")
            ACTUAL=$(git show "origin/main:$f")
            test "$EXPECTED" = "$ACTUAL"
          done
          if git show --name-only --pretty='' HEAD | grep -qx 'data.js'; then
            EXPECTED=$(cat data.js)
            ACTUAL=$(git show origin/main:data.js)
            test "$EXPECTED" = "$ACTUAL"
          fi
          echo "Quant decision commit and exact read-back verified."
