name: Quant Trigger Event Bridge

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quant-trigger-event-bridge
  cancel-in-progress: true

env:
  TRIGGER_COOLDOWN_MINUTES: "60"

jobs:
  trigger-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run trigger engine
        run: node quant/trigger-engine.js

      - name: Show trigger result
        run: cat quant/trigger.json

      - name: Check whether decision is required
        id: trigger
        shell: bash
        run: |
          NEEDS=$(node -e "const x=require('./quant/trigger.json'); process.stdout.write(String(x.needsDecision))")
          echo "needs=$NEEDS" >> "$GITHUB_OUTPUT"

      - name: Run Quant Trader decision consumer
        if: steps.trigger.outputs.needs == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY"
          node quant/decision-consumer.js

      - name: Check whether consumer produced a decision
        id: consumer
        if: steps.trigger.outputs.needs == 'true'
        shell: bash
        run: |
          if git diff --quiet -- quant/decision-event.json quant/decision-result.json data.js; then
            echo "produced=false" >> "$GITHUB_OUTPUT"
            echo "Duplicate/immaterial trigger suppressed; no model decision artifact to commit."
          else
            echo "produced=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit verified decision artifacts
        if: steps.trigger.outputs.needs == 'true' && steps.consumer.outputs.produced == 'true'
        shell: bash
        run: |
          git fetch origin main
          BASE_SHA=$(node -e "const x=require('./quant/decision-result.json'); process.stdout.write(x.baseCommitSha)")
          REMOTE_SHA=$(git rev-parse origin/main)
          if [ "$BASE_SHA" != "$REMOTE_SHA" ]; then
            echo "Authoritative main changed during decision; fail closed."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add quant/decision-event.json quant/decision-result.json
          if node -e "const x=require('./quant/decision-result.json'); process.exit(x.portfolioMutation ? 0 : 1)"; then
            git add data.js
          fi

          git commit -m "Quant decision $(node -e "const x=require('./quant/decision-result.json'); process.stdout.write(x.decision)") $(node -e "const x=require('./quant/decision-result.json'); process.stdout.write(x.triggerKey)")"
          git push origin HEAD:main

          git fetch origin main
          for f in quant/decision-event.json quant/decision-result.json; do
            EXPECTED=$(cat "$f")
            ACTUAL=$(git show "origin/main:$f")
            test "$EXPECTED" = "$ACTUAL"
          done
          if node -e "const x=require('./quant/decision-result.json'); process.exit(x.portfolioMutation ? 0 : 1)"; then
            EXPECTED=$(cat data.js)
            ACTUAL=$(git show origin/main:data.js)
            test "$EXPECTED" = "$ACTUAL"
          fi
          echo "Quant decision commit and exact read-back verified."
