name: Quant research shadow backtest
on:
  workflow_dispatch:
  push:
    branches: [research/quant-literature-20261009]
    paths:
      - 'quant/research/**'
      - '.github/workflows/quant-research-shadow.yml'
permissions:
  contents: read
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public price client
        run: python -m pip install 'yfinance>=0.2.60,<2'
      - name: Fetch adjusted historical closes
        run: python quant/research/fetch_prices.py --out /tmp/quant-research-prices.csv
      - name: Run shadow comparison
        run: python quant/research/backtest.py /tmp/quant-research-prices.csv | tee /tmp/quant-research-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quant-research-results
          path: /tmp/quant-research-results.json
          if-no-files-found: ignore
          retention-days: 14
