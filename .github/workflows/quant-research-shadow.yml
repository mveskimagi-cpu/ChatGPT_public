name: Quant research shadow backtest
on:
  workflow_dispatch:
  push:
    branches: [research/quant-literature-20261009]
    paths:
      - 'quant/research/**'
      - '.github/workflows/quant-research-shadow.yml'
permissions:
  contents: read
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate bundled market data and provenance
        run: |
          test "$(cat quant/research/data/DATA_SOURCE.txt)" = "real"
          test "$(wc -l < quant/research/data/ewa_ewc_2015_2024.csv)" -gt 2500
      - name: Reproduce holdout results
        run: |
          node quant/research/shadow-eval.mjs quant/research/data/ewa_ewc_2015_2024.csv > /tmp/research-result.json
          node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('/tmp/research-result.json')); const b=JSON.parse(fs.readFileSync('quant/research/results/ewa_ewc_shadow_2015_2024.json')); if(JSON.stringify(a.results)!==JSON.stringify(b.results))process.exit(1); console.log('Results match committed benchmark')"
      - uses: actions/upload-artifact@v4
        with:
          name: quant-research-results
          path: /tmp/research-result.json
          retention-days: 14
