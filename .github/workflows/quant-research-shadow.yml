name: Quant research robustness
on:
  workflow_dispatch:
  push:
    branches: [research/quant-literature-20261009]
    paths:
      - 'quant/research/**'
      - '.github/workflows/quant-research-shadow.yml'
permissions:
  contents: read
jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate bundled frozen data
        run: |
          test "$(cat quant/research/data/DATA_SOURCE.txt)" = "real"
          test "$(wc -l < quant/research/data/ewa_ewc_2015_2024.csv)" -gt 2500
      - name: Unit and no-lookahead tests
        run: node --test quant/research/robustness-v2.test.mjs
      - name: Walk-forward robustness and cost stress
        run: node quant/research/robustness-v2.mjs quant/research/data/ewa_ewc_2015_2024.csv | tee /tmp/quant-robustness-v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: quant-robustness-v2
          path: /tmp/quant-robustness-v2.json
          retention-days: 30
